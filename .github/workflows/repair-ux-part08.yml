name: Repair UX Payload Part 08

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'ux-foundations-batch-1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-foundations-batch-1
          fetch-depth: 0

      - name: Repair and validate part-08
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path('.github/ux-batch-payload/part-08')
          data = path.read_bytes()
          expected = 'eb525d2256ebd3291fed769facf95d15cd6404205c0aa6e6cac7b01ac459dd42'

          if sha256(data).hexdigest() != expected:
              if data[6526:6528] != b'ak':
                  raise SystemExit(f'Unexpected bytes at repair offset: {data[6526:6528]!r}')
              data = data[:6526] + b'c' + data[6528:]

          actual = sha256(data).hexdigest()
          if len(data) != 8000 or actual != expected:
              raise SystemExit(f'Repair failed: bytes={len(data)} sha256={actual}')

          path.write_bytes(data)
          print(f'Validated part-08 bytes={len(data)} sha256={actual}')
          PY

      - name: Commit repaired chunk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ux-batch-payload/part-08
          git commit -m "chore: repair UX payload part-08"
          git push origin ux-foundations-batch-1
