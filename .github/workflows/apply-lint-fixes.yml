name: Apply Strict Lint Fixes

on:
  push:
    branches: [ ci-diagnostic ]

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-diagnostic
      - name: Apply typed lint fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new))

          response_interface = '''interface BridgeResponseBody {
            [key: string]: unknown;
            status?: string;
            error?: string;
            token?: string;
            available?: boolean;
            version?: string;
            valid?: boolean;
            success?: boolean;
            exitCode?: number;
            stdout?: string;
            raw?: string;
          }

          '''

          for path in ['src/__tests__/bridgeSecurity.test.ts', 'src/__tests__/bridgeWorkspaceOps.test.ts']:
              replace(path, "import http from 'http';\n\n", "import http from 'http';\nimport type { AddressInfo } from 'node:net';\n\n" + response_interface)
              replace(path, 'const addr = server.address() as any;\n        port = addr.port;', 'const addr = server.address() as AddressInfo;\n        port = addr.port;')
              replace(path, 'body: any', 'body: BridgeResponseBody')
              replace(path, 'body: data });', 'body: { raw: data } });')

          replace('src/__tests__/bridgeSecurity.test.ts',
                  'const approvalToken = tokenRes.body.token;\n\n    // 2. Perform upload',
                  "const approvalToken = tokenRes.body.token;\n    expect(typeof approvalToken).toBe('string');\n    if (typeof approvalToken !== 'string') throw new Error('Approval token was not returned');\n\n    // 2. Perform upload")
          replace('src/__tests__/bridgeWorkspaceOps.test.ts',
                  "const withApproval = await makeRequest('/api/workspace/overwrite', { 'X-Approval-Token': tokenRes.body.token });",
                  "const approvalToken = tokenRes.body.token;\n    expect(typeof approvalToken).toBe('string');\n    if (typeof approvalToken !== 'string') throw new Error('Approval token was not returned');\n\n    const withApproval = await makeRequest('/api/workspace/overwrite', { 'X-Approval-Token': approvalToken });")

          path = 'src/__tests__/localBridgeSecurity.test.ts'
          replace(path,
                  "import http from 'http';\n\nconst { createServer, isPathContained } = require('../../packages/local-bridge/bridgeServer');\n\n",
                  "import http from 'http';\nimport { createServer, isPathContained } from '../../packages/local-bridge/bridgeServer';\n\n" + response_interface)
          replace(path,
                  'const getPort = () => (server.address() as any).port;',
                  "const getPort = () => {\n    const address = server.address();\n    if (!address || typeof address === 'string') throw new Error('Bridge server has no TCP address');\n    return address.port;\n  };")
          replace(path, 'body: any', 'body: BridgeResponseBody')
          replace(path, 'body: raw });', 'body: { raw } });')
          replace(path,
                  'const approvalToken = reqApprovalRes.body.token;\n    expect(approvalToken).toBeDefined();',
                  "const approvalToken = reqApprovalRes.body.token;\n    expect(typeof approvalToken).toBe('string');\n    if (typeof approvalToken !== 'string') throw new Error('Approval token was not returned');")

          path = 'src/__tests__/pcbRouting.test.ts'
          replace(path,
                  "import { getComponentPads } from '../components/board/boardGeometry';\n\ndescribe(",
                  "import { getComponentPads } from '../components/board/boardGeometry';\nimport type { BoardComponent } from '../types';\n\ndescribe(")
          replace(path,
                  "describe('Slice 2 Production PCB Editor & Routing Engine', () => {\n",
                  "describe('Slice 2 Production PCB Editor & Routing Engine', () => {\n  const requireBoardComponent = (id: string): BoardComponent => {\n    const component = (useProjectStore.getState().boardComponents || []).find(item => item.id === id);\n    expect(component).toBeDefined();\n    if (!component) throw new Error(`Board component ${id} was not created`);\n    return component;\n  };\n\n")
          for component_id, variable in [('comp_u1', 'compU1'), ('comp_u2', 'compU2'), ('comp_c1', 'compC1'), ('comp_c2', 'compC2')]:
              old = f"const {variable} = useProjectStore.getState().boardComponents?.find(c => c.id === '{component_id}')!;"
              new = f"const {variable} = requireBoardComponent('{component_id}');"
              replace(path, old, new)

          replace('src/components/ProjectManager.tsx',
                  "res.issues.map(i => (i as any).message || String(i)).join(', ')",
                  "res.issues.map(issue => typeof issue === 'object' && issue !== null && 'message' in issue ? String(issue.message) : String(issue)).join(', ')")

          path = 'src/components/firmware/FirmwareCodePreview.tsx'
          replace(path,
                  '''  // Initialize workspace if empty
  useEffect(() => {
    if (sourceFiles.length === 0) {
      const initialFiles = generateFirmwareWorkspace(store);
      store.updateProjectState({ firmwareSourceFiles: initialFiles });
      if (initialFiles.length > 0) {
        setSelectedFileId(initialFiles[0].id);
        setEditingContent(initialFiles[0].content);
      }
    } else if (!selectedFileId && sourceFiles.length > 0) {
      setSelectedFileId(sourceFiles[0].id);
      setEditingContent(sourceFiles[0].content);
    }
  }, [sourceFiles.length]);

  const activeFile = sourceFiles.find(f => f.id === selectedFileId);
''',
                  '''  // Initialize the external project workspace only. Local editor selection is derived below.
  useEffect(() => {
    if (sourceFiles.length === 0) {
      const initialFiles = generateFirmwareWorkspace(store);
      store.updateProjectState({ firmwareSourceFiles: initialFiles });
    }
  }, [sourceFiles.length, store]);

  const effectiveSelectedFileId = selectedFileId ?? sourceFiles[0]?.id ?? null;
  const activeFile = sourceFiles.find(file => file.id === effectiveSelectedFileId);
  const editorContent = selectedFileId ? editingContent : (activeFile?.content ?? '');
''')
          replace(path,
                  '''  const handleContentChange = (val: string) => {
    setEditingContent(val);
    if (selectedFileId) {
      const updated = sourceFiles.map(f => f.id === selectedFileId ? { ...f, content: val, dirty: true } : f);
      store.updateProjectState({ firmwareSourceFiles: updated });
    }
  };
''',
                  '''  const handleContentChange = (val: string) => {
    setEditingContent(val);
    const fileId = effectiveSelectedFileId;
    if (fileId) {
      if (!selectedFileId) setSelectedFileId(fileId);
      const updated = sourceFiles.map(file => file.id === fileId ? { ...file, content: val, dirty: true } : file);
      store.updateProjectState({ firmwareSourceFiles: updated });
    }
  };
''')
          replace(path,
                  '''  const handleSaveFile = () => {
    if (!selectedFileId) return;
    const updated = sourceFiles.map(f => f.id === selectedFileId ? { ...f, content: editingContent, dirty: false } : f);
''',
                  '''  const handleSaveFile = () => {
    const fileId = effectiveSelectedFileId;
    if (!fileId) return;
    const updated = sourceFiles.map(file => file.id === fileId ? { ...file, content: editorContent, dirty: false } : file);
''')
          replace(path,
                  "const lang = ext === 'cpp' || ext === 'c' || ext === 'h' ? 'cpp' : ext === 'ini' ? 'ini' : 'text';",
                  "const lang: FirmwareSourceFile['language'] = ext === 'cpp' || ext === 'c' || ext === 'h' ? 'cpp' : ext === 'ini' ? 'ini' : 'text';")
          replace(path, 'language: lang as any', 'language: lang')
          replace(path, 'selectedFileId === file.id', 'effectiveSelectedFileId === file.id')
          replace(path, 'value={editingContent}', 'value={editorContent}')

          replace('src/components/firmware/FirmwareStateMachineCanvas.tsx',
                  'const onNodeDragStart = useCallback((_event: any, _node: any) => {',
                  'const onNodeDragStart = useCallback(() => {')

          path = 'src/components/mechanical/MechanicalInspector.tsx'
          replace(path,
                  "import { MechanicalObject } from '../../types';\n",
                  "import { MechanicalObject } from '../../types';\nimport { applyLightweightConstraint } from '../../lib/mechanical/mechanicalGeometry';\n")
          replace(path,
                  "            const { applyLightweightConstraint } = require('../../lib/mechanical/mechanicalGeometry');\n            const updated = applyLightweightConstraint(cType, obj, refObj, dist);",
                  '            const updated = applyLightweightConstraint(cType, obj, refObj, dist);')

          replace('src/components/product/ProductArchitectureCanvas.tsx',
                  'const onNodeDragStart = useCallback((_event: any, _node: any) => {',
                  'const onNodeDragStart = useCallback(() => {')

          path = 'src/lib/exportFirmware.ts'
          replace(path, "import { Project } from '../types';", "import { FirmwareSourceFile, Project } from '../types';")
          replace(path, 'export function generateFirmwareWorkspace(project: Project): any[] {', 'export function generateFirmwareWorkspace(project: Project): FirmwareSourceFile[] {')

          path = 'src/lib/mechanical/mechanicalGeometry.ts'
          replace(path, "import { MechanicalObject } from '../../types';", "import { MechanicalObject, Project } from '../../types';")
          replace(path, 'export function checkMechanicalInterference(project: any): CollisionResult {', 'export function checkMechanicalInterference(project: Project): CollisionResult {')
          replace(path, '(project.mechanicalBodies || []).forEach((b: any) => {', '(project.mechanicalBodies || []).forEach((b) => {')
          replace(path, '(project.mechanicalObjects || []).forEach((obj: any) => {', '(project.mechanicalObjects || []).forEach((obj) => {')
          replace(path, '.filter((c: any) => c.boardId === activeBoardId && c.pcb?.placed !== false)', '.filter((c) => c.boardId === activeBoardId && c.pcb?.placed !== false)')
          replace(path, '.forEach((c: any) => {', '.forEach((c) => {')

          replace('src/lib/nativeExports.ts',
                  "activeBranch: (project as any).activeBranchName || (project as any).activeBranch || 'main',",
                  "activeBranch: project.activeBranchName || project.activeBranch || 'main',")

          replace('src/lib/pcb/pcbRoutingEngine.ts',
                  'componentId: (nearestPad as any).componentId,',
                  'componentId: nearestPad.componentId,')

          path = 'src/lib/releaseEngine.ts'
          replace(path, 'sourceValue: any;\n  targetValue: any;', 'sourceValue: unknown;\n  targetValue: unknown;')
          replace(path, 'const sourceProject = sourceRevision.projectSnapshot;', 'const sourceProject = sourceRevision.projectSnapshot as Project | undefined;')
          replace(path, 'sourceMechs.forEach((sObj: any) => {\n    const tObj = targetMechs.find((t: any) => t.id === sObj.id);', 'sourceMechs.forEach((sObj) => {\n    const tObj = targetMechs.find((t) => t.id === sObj.id);')
          replace(path, 'sourceComps.forEach((sComp: any) => {\n    const tComp = targetComps.find((t: any) => t.id === sComp.id);', 'sourceComps.forEach((sComp) => {\n    const tComp = targetComps.find((t) => t.id === sComp.id);')

          replace('src/lib/validationRunner.ts', 'let evidenceLink = options?.evidenceLink;', 'const evidenceLink = options?.evidenceLink;')

          path = 'src/store/projectStore.ts'
          replace(path, "const OLD_KEY = 'hardware_studio_system_alpha_project';", "const OLD_KEY = 'hardware_studio_legacy_project';")
          replace(path,
                  'const linkedMechId = (currentComp as any).mechanicalObjectId || (currentComp as any).linkedMechanicalObjectId;',
                  'const linkedMechId = currentComp.mechanicalObjectId || currentComp.linkedMechanicalObjectId;')
          replace(path, "const id = (obj as any).id || `mech_obj_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;", "const id = obj.id || `mech_obj_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;")
          replace(path, 'const tx = (get() as any).activeTransaction;', 'const tx = get().activeTransaction;')

          path = 'src/types/index.ts'
          replace(path,
                  "  architectureNodeId?: string;\n  bomItemId?: string;",
                  "  architectureNodeId?: string;\n  bomItemId?: string;\n  mechanicalObjectId?: string;\n  linkedMechanicalObjectId?: string;")
          replace(path, 'evidence?: any[];\n  stepResults?: any[];', 'evidence?: unknown[];\n  stepResults?: unknown[];')
          replace(path,
                  'export type MCPProposal = Record<string, any>;\nexport type MCPAuditRecord = Record<string, any>;',
                  '''export interface MCPProposal {
  id: string;
  proposalId?: string;
  timestamp: string;
  proposedBy?: string;
  description?: string;
  domain?: string;
  patch?: Partial<Project>;
  diffSummary?: string;
  status: 'Pending' | 'Applied' | 'Rejected';
}

export interface MCPAuditRecord {
  id: string;
  timestamp: string;
  tool: string;
  params: Record<string, unknown>;
  resultStatus: string;
  requiresApproval: boolean;
  approved: boolean;
}''')
          replace(path, 'firmwareBuildRecords?: any[];', 'firmwareBuildRecords?: Record<string, unknown>[];')
          replace(path, 'mcpProposals?: any[];\n  mcpAuditRecords?: any[];', 'mcpProposals?: MCPProposal[];\n  mcpAuditRecords?: MCPAuditRecord[];')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(ci): resolve strict TypeScript ESLint errors [skip ci]"
          git push origin HEAD:ci-diagnostic
