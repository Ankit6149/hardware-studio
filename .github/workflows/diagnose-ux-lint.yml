name: Diagnose UX Batch Lint

on:
  pull_request:
    branches: [master]

jobs:
  lint-report:
    if: github.head_ref == 'ux-foundations-batch-1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-foundations-batch-1

      - name: Reconstruct production source
        run: |
          cat .github/ux-batch-payload/part-* > /tmp/ux-payload.b64
          base64 -d /tmp/ux-payload.b64 > /tmp/ux-payload.tar.gz
          tar -xzf /tmp/ux-payload.tar.gz

      - name: Install dependencies
        run: npm ci

      - name: Generate complete ESLint report
        shell: bash
        run: |
          set +e
          npx eslint . --format json --output-file /tmp/eslint-report.json
          echo "$?" > /tmp/eslint-exit-code.txt
          exit 0

      - name: Upload ESLint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ux-eslint-report
          path: |
            /tmp/eslint-report.json
            /tmp/eslint-exit-code.txt

      - name: Require clean lint
        run: test "$(cat /tmp/eslint-exit-code.txt)" = "0"
