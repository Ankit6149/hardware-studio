name: CI Diagnostic

on:
  pull_request:
    branches: [ master ]

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Regenerate and validate package lock
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch ci-diagnostic https://github.com/Ankit6149/hardware-studio.git repo
          cd repo
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Upload validated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: validated-package-lock
          path: repo/package-lock.json
          if-no-files-found: error
