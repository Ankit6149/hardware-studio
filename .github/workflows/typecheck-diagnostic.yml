name: Typecheck Diagnostic

on:
  pull_request:
    branches: [ master ]

jobs:
  typecheck-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce TypeScript failure
        shell: bash
        run: |
          set -o pipefail
          git clone --depth 1 --branch ci-diagnostic https://github.com/Ankit6149/hardware-studio.git repo
          cd repo
          npm ci >/dev/null 2>&1
          npm run typecheck 2>&1 | tail -n 160
