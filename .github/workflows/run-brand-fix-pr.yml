name: Run Brand Fix For Review

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'visual-identity-fix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-identity-fix
          fetch-depth: 1
          show-progress: false

      - name: Extract and run the reviewed correction
        shell: bash
        run: |
          set +e
          awk '
            /python - <<.PY./ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-brand-scale-fix.yml > /tmp/apply-brand-scale-fix.py
          python -m py_compile /tmp/apply-brand-scale-fix.py > /tmp/brand-fix-result.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python /tmp/apply-brand-scale-fix.py >> /tmp/brand-fix-result.log 2>&1
            code=$?
          fi
          echo "$code" > /tmp/brand-fix-exit-code.txt
          exit 0

      - name: Upload correction diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: brand-fix-diagnostics
          path: |
            /tmp/apply-brand-scale-fix.py
            /tmp/brand-fix-result.log
            /tmp/brand-fix-exit-code.txt

      - name: Require successful correction
        run: test "$(cat /tmp/brand-fix-exit-code.txt)" = "0"

      - name: Verify application
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit verified correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(brand): restore original mark favicon and compact landing scale"
          git push origin visual-identity-fix
