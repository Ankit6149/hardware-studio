name: Run Brand Fix For Review

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'visual-identity-fix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-identity-fix
          fetch-depth: 1
          show-progress: false

      - name: Normalize remaining legacy identifiers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'SystemAlpha': 'HardwareStudio',
              'systemAlpha': 'hardwareStudio',
              'SYSTEM_ALPHA': 'HARDWARE_STUDIO',
              'systemalpha': 'hardwarestudio',
          }
          suffixes = {'.ts', '.tsx', '.js', '.jsx', '.json', '.md', '.txt', '.yml', '.yaml', '.html', '.css'}
          for file in Path('.').rglob('*'):
              if not file.is_file() or '.git' in file.parts or file.suffix.lower() not in suffixes:
                  continue
              if file == Path('.github/workflows/apply-brand-scale-fix.yml'):
                  continue
              text = file.read_text()
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  file.write_text(updated)
          PY

      - name: Extract and run the reviewed correction
        shell: bash
        run: |
          set +e
          awk '
            /python - <<.PY./ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-brand-scale-fix.yml > /tmp/apply-brand-scale-fix.py
          python -m py_compile /tmp/apply-brand-scale-fix.py > /tmp/brand-fix-result.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python /tmp/apply-brand-scale-fix.py >> /tmp/brand-fix-result.log 2>&1
            code=$?
          fi
          python - <<'PY' >> /tmp/brand-fix-result.log 2>&1
          from pathlib import Path
          import re

          pattern = re.compile(r'system[\s_-]*alpha', re.IGNORECASE)
          suffixes = {'.ts', '.tsx', '.js', '.jsx', '.json', '.md', '.txt', '.yml', '.yaml', '.html', '.css'}
          print('\nExact remaining matches:')
          for file in Path('.').rglob('*'):
              if not file.is_file() or '.git' in file.parts or file.suffix.lower() not in suffixes:
                  continue
              try:
                  lines = file.read_text().splitlines()
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(lines, 1):
                  if pattern.search(line):
                      print(f'{file}:{number}: {line.strip()}')
          PY
          echo "$code" > /tmp/brand-fix-exit-code.txt
          exit 0

      - name: Upload correction diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: brand-fix-diagnostics
          path: |
            /tmp/apply-brand-scale-fix.py
            /tmp/brand-fix-result.log
            /tmp/brand-fix-exit-code.txt

      - name: Require successful correction
        run: test "$(cat /tmp/brand-fix-exit-code.txt)" = "0"

      - name: Verify application
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit verified correction
        run: |
          rm -f .github/brand-fix-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(brand): restore original mark favicon and compact landing scale"
          git push origin visual-identity-fix
