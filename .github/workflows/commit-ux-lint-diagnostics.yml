name: Commit UX Lint Diagnostics

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'ux-foundations-batch-1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-foundations-batch-1
          fetch-depth: 0

      - name: Reconstruct production source
        run: |
          cat .github/ux-batch-payload/part-* > /tmp/ux-payload.b64
          base64 -d /tmp/ux-payload.b64 > /tmp/ux-payload.tar.gz
          tar -xzf /tmp/ux-payload.tar.gz

      - name: Install dependencies
        run: npm ci

      - name: Generate concise lint diagnostics
        shell: bash
        run: |
          set +e
          npx eslint . --format json --output-file /tmp/eslint-report.json
          lint_code=$?
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/eslint-report.json').read_text())
          lines = []
          errors = 0
          warnings = 0
          for file_result in report:
              messages = [m for m in file_result.get('messages', []) if m.get('severity', 0) > 0]
              if not messages:
                  continue
              path = file_result['filePath']
              try:
                  path = str(Path(path).relative_to(Path.cwd()))
              except ValueError:
                  pass
              lines.append(f'## {path}')
              for message in messages:
                  severity = 'error' if message.get('severity') == 2 else 'warning'
                  errors += severity == 'error'
                  warnings += severity == 'warning'
                  rule = message.get('ruleId') or 'parser'
                  lines.append(
                      f"{severity.upper()} {message.get('line', 0)}:{message.get('column', 0)} "
                      f"[{rule}] {message.get('message', '').replace(chr(10), ' ')}"
                  )
              lines.append('')
          header = [
              '# UX foundations lint diagnostics',
              '',
              f'Errors: {errors}',
              f'Warnings: {warnings}',
              '',
          ]
          Path('.github/ux-lint-diagnostics.md').write_text('\n'.join(header + lines))
          PY
          echo "$lint_code" > .github/ux-lint-exit-code.txt
          exit 0

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ux-lint-diagnostics.md .github/ux-lint-exit-code.txt
          git commit -m "chore: capture UX foundations lint diagnostics"
          git push origin ux-foundations-batch-1
