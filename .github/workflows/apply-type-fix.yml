name: Apply MCP Type Fix

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  apply-type-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-diagnostic
      - name: Update persisted MCP record types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/types/index.ts')
          text = path.read_text()
          old = '''export interface MCPProposal {
            id: string;
            proposalId?: string;
            timestamp: string;
            proposedBy?: string;
            description?: string;
            domain?: string;
            patch?: Partial<Project>;
            diffSummary?: string;
            status: 'Pending' | 'Applied' | 'Rejected';
          }

          export interface MCPAuditRecord {
            id: string;
            timestamp: string;
            tool: string;
            params: Record<string, unknown>;
            resultStatus: string;
            requiresApproval: boolean;
            approved: boolean;
          }'''
          new = '''export interface MCPProposal {
            id: string;
            proposalId?: string;
            timestamp?: string;
            createdAt?: string;
            proposedBy?: string;
            description?: string;
            domain?: string;
            toolName?: string;
            args?: Record<string, unknown>;
            patch?: Partial<Project>;
            diffSummary?: string;
            status: 'Pending' | 'Applied' | 'Rejected';
          }

          export interface MCPAuditRecord {
            id: string;
            timestamp: string;
            tool?: string;
            action?: string;
            params?: Record<string, unknown>;
            proposalId?: string;
            executedBy?: string;
            resultStatus?: string;
            status?: string;
            requiresApproval?: boolean;
            approved?: boolean;
          }'''
          if old not in text:
              raise SystemExit('Expected MCP interface block not found')
          path.write_text(text.replace(old, new))
          PY
          npm ci
          npm run lint
          npm run typecheck
      - name: Commit verified type correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/index.ts
          git commit -m "fix(types): support persisted MCP proposal and audit schemas [skip ci]"
          git push origin HEAD:ci-diagnostic
