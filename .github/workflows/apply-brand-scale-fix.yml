name: Apply Brand And Scale Fix

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-identity-fix
          fetch-depth: 0

      - name: Restore original mark and reduce landing scale
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          import re
          import struct
          import zlib

          root = Path('.')

          brand_mark = '''import React from 'react';

interface BrandMarkProps {
  className?: string;
  title?: string;
}

export const BrandMark: React.FC<BrandMarkProps> = ({
  className = 'h-9 w-9',
  title = 'Hardware Studio',
}) => (
  <span
    className={`inline-flex shrink-0 items-center justify-center overflow-hidden rounded-[28%] shadow-[0_8px_24px_rgba(15,23,42,0.16)] ${className}`}
    aria-label={title}
    role="img"
  >
    <svg viewBox="0 0 64 64" className="h-full w-full" aria-hidden="true">
      <rect width="64" height="64" rx="16" fill="#11110f" />
      <g
        fill="none"
        stroke="#f3f0e8"
        strokeWidth="3.4"
        strokeLinecap="round"
        strokeLinejoin="round"
      >
        <rect x="14" y="14" width="36" height="36" rx="4" />
        <path d="M30 26h8a4 4 0 0 0 4-4v-8" />
        <circle cx="26" cy="26" r="4" />
        <path d="M22 50v-8a4 4 0 0 1 4-4h8" />
        <circle cx="38" cy="38" r="4" />
      </g>
    </svg>
  </span>
);
'''
          Path('src/components/BrandMark.tsx').write_text(brand_mark)

          icon_svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="16" fill="#11110f"/>
  <g fill="none" stroke="#f3f0e8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="36" height="36" rx="4"/>
    <path d="M30 26h8a4 4 0 0 0 4-4v-8"/>
    <circle cx="26" cy="26" r="4"/>
    <path d="M22 50v-8a4 4 0 0 1 4-4h8"/>
    <circle cx="38" cy="38" r="4"/>
  </g>
</svg>
'''
          Path('src/app/icon.svg').write_text(icon_svg)

          layout_path = Path('src/app/layout.tsx')
          layout = layout_path.read_text()
          marker = "  robots: {\n    index: true,\n    follow: true,\n  },\n"
          icons = "  icons: {\n    icon: [\n      { url: '/favicon.ico', sizes: 'any' },\n      { url: '/icon.svg', type: 'image/svg+xml' },\n    ],\n    shortcut: '/favicon.ico',\n  },\n"
          if '  icons: {' not in layout:
              if marker not in layout:
                  raise SystemExit('Could not locate metadata insertion point')
              layout = layout.replace(marker, marker + icons)
          layout_path.write_text(layout)

          page_path = Path('src/app/page.tsx')
          page = page_path.read_text()
          replacements = {
              'h-14 max-w-[1280px]': 'h-12 max-w-[1120px]',
              'className="flex items-center gap-2.5" aria-label="Hardware Studio home"': 'className="flex items-center gap-2" aria-label="Hardware Studio home"',
              '<BrandMark className="h-8 w-8" />': '<BrandMark className="h-7 w-7" />',
              'text-[13px] font-semibold tracking-[-0.02em]': 'text-[12px] font-semibold tracking-[-0.02em]',
              'mt-0.5 text-[8px] uppercase tracking-[0.18em]': 'mt-0.5 text-[7px] uppercase tracking-[0.17em]',
              'gap-6 text-[11px]': 'gap-5 text-[10px]',
              'px-3.5 py-2 text-[10px]': 'px-3 py-1.5 text-[10px]',
              'max-w-[1280px] px-4 pb-14 pt-10 sm:px-6 sm:pb-16 sm:pt-14 lg:px-8 lg:pb-20 lg:pt-16': 'max-w-[1120px] px-4 pb-10 pt-8 sm:px-6 sm:pb-12 sm:pt-10 lg:px-8 lg:pb-14 lg:pt-12',
              'h-[420px] w-[760px]': 'h-[340px] w-[650px]',
              'gap-10 lg:grid-cols-[0.96fr_1.04fr] lg:gap-14': 'gap-8 lg:grid-cols-[0.94fr_1.06fr] lg:gap-10',
              'max-w-[650px]': 'max-w-[540px]',
              'mb-5 inline-flex': 'mb-4 inline-flex',
              'px-3 py-1.5 text-[9px]': 'px-2.5 py-1 text-[8px]',
              'text-[clamp(2.75rem,5.4vw,5.45rem)]': 'text-[clamp(2.35rem,4.25vw,4.25rem)]',
              'mt-6 max-w-[610px] text-[15px] leading-7 text-black/60 sm:text-base': 'mt-4 max-w-[520px] text-[13px] leading-6 text-black/60 sm:text-[14px]',
              'mt-7 flex flex-col': 'mt-5 flex flex-col',
              'h-11 items-center justify-center gap-2 rounded-full bg-[#11110f] px-5 text-[12px]': 'h-10 items-center justify-center gap-2 rounded-full bg-[#11110f] px-4 text-[11px]',
              'h-11 items-center justify-center gap-2 rounded-full border border-black/15 bg-white/48 px-5 text-[12px]': 'h-10 items-center justify-center gap-2 rounded-full border border-black/15 bg-white/48 px-4 text-[11px]',
              'mt-6 flex max-w-[610px] items-start gap-3 rounded-2xl border border-red-950/15 bg-red-50/55 p-3.5 text-[12px] leading-5': 'mt-5 flex max-w-[520px] items-start gap-2.5 rounded-xl border border-red-950/15 bg-red-50/55 p-3 text-[11px] leading-5',
              'max-w-[570px]': 'max-w-[500px]',
              '-inset-6 rounded-[40px]': '-inset-4 rounded-[34px]',
              'rounded-[24px] border border-black/12 bg-[#151512] p-3': 'rounded-[22px] border border-black/12 bg-[#151512] p-2.5',
              'min-h-[350px] overflow-hidden rounded-[17px] border border-white/8 bg-[#0c0c0b] p-4 sm:min-h-[410px] sm:p-5': 'min-h-[300px] overflow-hidden rounded-[16px] border border-white/8 bg-[#0c0c0b] p-3.5 sm:min-h-[350px] sm:p-4',
              'min-h-[318px] flex-col justify-between sm:min-h-[368px]': 'min-h-[270px] flex-col justify-between sm:min-h-[310px]',
              'my-4 w-[76%] rounded-[20px]': 'my-3 w-[78%] rounded-[18px]',
              'bg-emerald-300/10 p-4 text-center': 'bg-emerald-300/10 p-3.5 text-center',
              'max-w-[1280px]': 'max-w-[1120px]',
              'px-4 py-14 sm:px-6 sm:py-16 lg:px-8 lg:py-20': 'px-4 py-11 sm:px-6 sm:py-12 lg:px-8 lg:py-14',
              'gap-8 px-4 py-14 sm:px-6 sm:py-16 lg:grid-cols-[0.82fr_1.18fr] lg:px-8 lg:py-20': 'gap-7 px-4 py-11 sm:px-6 sm:py-12 lg:grid-cols-[0.82fr_1.18fr] lg:px-8 lg:py-14',
              'mb-9 max-w-[720px]': 'mb-7 max-w-[680px]',
              'text-3xl font-semibold leading-[1.04] tracking-[-0.042em] sm:text-4xl': 'text-[1.75rem] font-semibold leading-[1.04] tracking-[-0.042em] sm:text-3xl',
              'text-3xl font-semibold tracking-[-0.042em] sm:text-4xl': 'text-[1.75rem] font-semibold tracking-[-0.042em] sm:text-3xl',
              'rounded-[20px] border border-black/10 bg-white/42 p-5': 'rounded-[18px] border border-black/10 bg-white/42 p-4',
              'mt-5 text-[17px]': 'mt-4 text-[15px]',
              'mt-10 overflow-hidden rounded-[22px]': 'mt-8 overflow-hidden rounded-[20px]',
              'p-5 text-[#f3f0e8] sm:p-6': 'p-4 text-[#f3f0e8] sm:p-5',
              'rounded-[24px] border border-black/12 bg-[#11110f] px-5 py-8': 'rounded-[22px] border border-black/12 bg-[#11110f] px-5 py-7',
              'sm:px-8 sm:py-10 lg:px-10': 'sm:px-7 sm:py-8 lg:px-8',
              'h-11 items-center justify-center gap-2 rounded-full bg-[#f3f0e8] px-5 text-[12px]': 'h-10 items-center justify-center gap-2 rounded-full bg-[#f3f0e8] px-4 text-[11px]',
              'h-11 items-center justify-center gap-2 rounded-full border border-white/15 px-5 text-[12px]': 'h-10 items-center justify-center gap-2 rounded-full border border-white/15 px-4 text-[11px]',
          }
          for old, new in replacements.items():
              if old in page:
                  page = page.replace(old, new)
          page_path.write_text(page)

          targeted = [
              ('by System Alpha', 'connected engineering workspace'),
              ('By System Alpha', 'Connected engineering workspace'),
              ('BY SYSTEM ALPHA', 'CONNECTED ENGINEERING WORKSPACE'),
              ('System Alpha External Logic', 'External Companion Logic'),
              ('System Alpha Local Engine / API Server', 'Local companion engine / API server'),
              ('real System Alpha host software', 'a real companion host'),
              ('System Alpha host software', 'companion host software'),
              ('System Alpha host', 'companion host'),
              ('system-alpha-external', 'companion-software-external'),
              ('SYSTEM-ALPHA', 'HARDWARE-STUDIO'),
              ('system-alpha', 'hardware-studio'),
              ('system_alpha', 'hardware_studio'),
              ('System Alpha', 'Hardware Studio'),
          ]
          allowed_suffixes = {'.ts', '.tsx', '.js', '.jsx', '.json', '.md', '.txt', '.yml', '.yaml', '.html', '.css'}
          for file in root.rglob('*'):
              if not file.is_file() or file.suffix.lower() not in allowed_suffixes:
                  continue
              if '.git' in file.parts or file == Path('.github/workflows/apply-brand-scale-fix.yml'):
                  continue
              try:
                  text = file.read_text()
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in targeted:
                  updated = updated.replace(old, new)
              if updated != text:
                  file.write_text(updated)

          high = 256
          out = 64
          scale = high / 64
          pixels = [(0, 0, 0, 0)] * (high * high)

          def inside_round_rect(x, y, left, top, right, bottom, radius):
              if left + radius <= x <= right - radius and top <= y <= bottom:
                  return True
              if left <= x <= right and top + radius <= y <= bottom - radius:
                  return True
              cx = left + radius if x < left + radius else right - radius
              cy = top + radius if y < top + radius else bottom - radius
              return (x - cx) ** 2 + (y - cy) ** 2 <= radius ** 2

          def blend_pixel(x, y, color):
              if 0 <= x < high and 0 <= y < high:
                  pixels[y * high + x] = color

          for y in range(high):
              for x in range(high):
                  if inside_round_rect(x + 0.5, y + 0.5, 0, 0, high - 1, high - 1, 64):
                      blend_pixel(x, y, (17, 17, 15, 255))

          white = (243, 240, 232, 255)

          def dist_segment(px, py, x1, y1, x2, y2):
              vx, vy = x2 - x1, y2 - y1
              wx, wy = px - x1, py - y1
              c1 = vx * wx + vy * wy
              if c1 <= 0:
                  return math.hypot(px - x1, py - y1)
              c2 = vx * vx + vy * vy
              if c2 <= c1:
                  return math.hypot(px - x2, py - y2)
              b = c1 / c2
              bx, by = x1 + b * vx, y1 + b * vy
              return math.hypot(px - bx, py - by)

          def draw_segment(x1, y1, x2, y2, width):
              x1 *= scale; y1 *= scale; x2 *= scale; y2 *= scale
              half = width * scale / 2
              xmin = max(0, int(min(x1, x2) - half - 1)); xmax = min(high - 1, int(max(x1, x2) + half + 1))
              ymin = max(0, int(min(y1, y2) - half - 1)); ymax = min(high - 1, int(max(y1, y2) + half + 1))
              for yy in range(ymin, ymax + 1):
                  for xx in range(xmin, xmax + 1):
                      if dist_segment(xx + 0.5, yy + 0.5, x1, y1, x2, y2) <= half:
                          blend_pixel(xx, yy, white)

          def draw_circle(cx, cy, radius, width):
              cx *= scale; cy *= scale; radius *= scale; half = width * scale / 2
              xmin = max(0, int(cx - radius - half - 1)); xmax = min(high - 1, int(cx + radius + half + 1))
              ymin = max(0, int(cy - radius - half - 1)); ymax = min(high - 1, int(cy + radius + half + 1))
              for yy in range(ymin, ymax + 1):
                  for xx in range(xmin, xmax + 1):
                      d = math.hypot(xx + 0.5 - cx, yy + 0.5 - cy)
                      if abs(d - radius) <= half:
                          blend_pixel(xx, yy, white)

          draw_segment(18, 14, 46, 14, 3.4)
          draw_segment(50, 18, 50, 46, 3.4)
          draw_segment(46, 50, 18, 50, 3.4)
          draw_segment(14, 46, 14, 18, 3.4)
          for cx, cy, a0 in [(18,18,180),(46,18,270),(46,46,0),(18,46,90)]:
              pts = []
              for i in range(13):
                  a = math.radians(a0 + i * 90 / 12)
                  pts.append((cx + 4 * math.cos(a), cy + 4 * math.sin(a)))
              for p1, p2 in zip(pts, pts[1:]):
                  draw_segment(*p1, *p2, 3.4)

          draw_segment(30, 26, 38, 26, 3.4)
          pts = [(38,26),(39.5,25.7),(40.8,24.8),(41.7,23.5),(42,22),(42,14)]
          for p1, p2 in zip(pts, pts[1:]): draw_segment(*p1, *p2, 3.4)
          draw_circle(26, 26, 4, 3.4)
          draw_segment(22, 50, 22, 42, 3.4)
          pts = [(22,42),(22.3,40.5),(23.2,39.2),(24.5,38.3),(26,38),(34,38)]
          for p1, p2 in zip(pts, pts[1:]): draw_segment(*p1, *p2, 3.4)
          draw_circle(38, 38, 4, 3.4)

          small = []
          factor = high // out
          for oy in range(out):
              for ox in range(out):
                  block = []
                  for yy in range(oy * factor, (oy + 1) * factor):
                      for xx in range(ox * factor, (ox + 1) * factor):
                          block.append(pixels[yy * high + xx])
                  small.append(tuple(sum(p[i] for p in block) // len(block) for i in range(4)))

          def png_bytes(width, height, rgba):
              raw = bytearray()
              for y in range(height):
                  raw.append(0)
                  for x in range(width):
                      raw.extend(rgba[y * width + x])
              def chunk(kind, data):
                  return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
              return (b'\x89PNG\r\n\x1a\n' +
                      chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0)) +
                      chunk(b'IDAT', zlib.compress(bytes(raw), 9)) +
                      chunk(b'IEND', b''))

          png = png_bytes(out, out, small)
          ico_header = struct.pack('<HHH', 0, 1, 1)
          ico_entry = struct.pack('<BBBBHHII', out, out, 0, 0, 1, 32, len(png), 22)
          Path('src/app/favicon.ico').write_bytes(ico_header + ico_entry + png)

          Path('.github/workflows/apply-brand-scale-fix.yml').unlink()

          remaining = []
          pattern = re.compile(r'system[\s_-]*alpha', re.IGNORECASE)
          for file in root.rglob('*'):
              if not file.is_file() or '.git' in file.parts:
                  continue
              if file.suffix.lower() not in allowed_suffixes:
                  continue
              try:
                  text = file.read_text()
              except UnicodeDecodeError:
                  continue
              if pattern.search(text):
                  remaining.append(str(file))
          if remaining:
              raise SystemExit('Legacy branding remains in: ' + ', '.join(remaining))
          PY

      - name: Verify application
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit verified visual identity fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(brand): restore original mark favicon and compact landing scale"
          git push origin visual-identity-fix
