name: Apply Strict Lint Fixes PR

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-diagnostic
      - name: Apply typed fixes
        run: python scripts/apply_lint_fixes.py
      - name: Verify dependency install and lint
        run: |
          npm ci
          npm run lint
      - name: Commit verified fixes
        run: |
          if git diff --quiet -- src; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(ci): resolve strict TypeScript ESLint errors [skip ci]"
          git push origin HEAD:ci-diagnostic
